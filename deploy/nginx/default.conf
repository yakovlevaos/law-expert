server {
    listen 0.0.0.0:80;

    # Photos, PDFs and video are served straight off the mounted directory.
    # Piping ~400 MB of media through the Node process would be pure overhead,
    # and nginx handles range requests for the video files properly.
    location /images/ {
        root /var/www/media;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location /docs/ {
        root /var/www/media;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
