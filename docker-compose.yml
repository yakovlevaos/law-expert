version: "3"

services:
  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: "genesis-nginx"
    restart: unless-stopped
    networks:
      genesis-web:
        # The external reverse proxy reaches the site at this address.
        ipv4_address: 177.169.0.57
    volumes:
      - ./client/dist/:/var/www/html/

networks:
  genesis-web:
    driver: bridge
    ipam:
      config:
        - subnet: 177.169.0.0/24
