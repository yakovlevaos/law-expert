services:
  app:
    build:
      # web/ is self-contained — the app and its media both live there — so the
      # context does not have to be the repository root.
      context: ./web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-https://genesis-expert.ru/api/v1}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-96536967}
    container_name: "genesis-app"
    restart: unless-stopped
    environment:
      # Must match the build arg: `images.remotePatterns` is baked in at build.
      API_BASE_URL: ${API_BASE_URL:-https://genesis-expert.ru/api/v1}
    volumes:
      # next/image optimises local sources off disk, so the app needs the media
      # even though nginx is what serves it to visitors.
      - ./web/public/images:/app/public/images:ro
      - ./web/public/docs:/app/public/docs:ro
    networks:
      - genesis-web

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: "genesis-nginx"
    restart: unless-stopped
    depends_on:
      - app
    # Bound to the loopback interface, never 0.0.0.0: the site must reach the
    # outside only through the VPS's TLS terminator, which sits on the same
    # host and proxies to this port.
    ports:
      - "127.0.0.1:8083:80"
    networks:
      genesis-web:
        # Kept until the head nginx upstream has been moved to the published
        # port above and that has been seen working. Note that 177.169.0.0/24
        # is public address space, not RFC1918 — the loopback port is what
        # replaces it.
        ipv4_address: 177.169.0.57
    volumes:
      - ./web/public:/var/www/media:ro

networks:
  genesis-web:
    driver: bridge
    ipam:
      config:
        - subnet: 177.169.0.0/24
